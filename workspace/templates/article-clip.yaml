key: article-clip
builtin: true
version: 2
name: 深度长文
description: 适合：把素材与观点写成有头图、插图的深度长文。流程：主稿（可审阅）→ 头图 → 文中插图（可选）→ 多平台适配（可选）→ 发布稿 → 合规审核（可关，block 级拦截）。
genre: article
scene: produce
next: [platform-adapt, review-restock]
inputs:
  - key: topic
    label: 选题与目标受众点
    kind: text
    required: true
  - key: platform
    label: 首发平台
    kind: select
    required: false
    options: [微信公众号, 知乎, 小红书, 头条]
    default: 微信公众号
  - key: profile
    label: 账号档案（人设/受众称呼/口头禅/禁用词）
    kind: files
    required: false
    accept: [.md]
  - key: material
    label: 素材/事实线索（md/txt）
    kind: files
    required: false
    accept: [.md, .txt]
  - key: with_inline_images
    label: 文中插图（false=仅头图）
    kind: bool
    required: false
    default: false
  - key: image_count
    label: 插图张数
    kind: int
    required: false
    default: 3
  - key: to_platforms
    label: 多平台适配（选填，可多选；留空=仅原稿）
    kind: multi_select
    required: false
    options: [公众号, 小红书, 知乎, 头条, 抖音, 快手, 视频号, B站]
  - key: with_compliance
    label: 发布稿合规审核（false=跳过；词库命中 block 级会拦截出稿）
    kind: bool
    required: false
    default: true
defaults:
  llm: { temperature: 0.7, max_tokens: 24000 }
  image: { provider: pollinations_image, size: "1536x1024" }
steps:
  - key: recall
    action: memory_recall
    title: 记忆召回
    inputs:
      query: input.topic
    params: { limit: 3 }
  - key: draft
    action: ai_text
    title: 深度长文主稿
    after: [recall]
    inputs:
      topic: input.topic
      profile: input.profile
      material: input.material
      platform: input.platform
      recalled: steps.recall.asset
    params:
      prompt_tpl: article-draft.md
      output_purpose: script
      name_tpl: "draft.md"
    gate:
      mode: required
      message: 请审阅深度长文主稿「{input.topic}」，批准后生成头图/插图；驳回可附修改意见重跑
  - key: cover_prompt
    action: ai_text
    title: 头图提示词
    after: [draft]
    inputs:
      draft: steps.draft.asset
      platform: input.platform
    params:
      prompt_tpl: cover-note.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "cover-prompt.json"
  - key: cover
    action: ai_image
    title: 头图出图
    after: [cover_prompt]
    inputs:
      shots: steps.cover_prompt.asset
    batch: { field: shots, max_concurrent: 1, retry: 1 }
  - key: inline_prompts
    action: ai_text
    title: 文中插图提示词
    when: input.with_inline_images == true
    after: [draft]
    inputs:
      draft: steps.draft.asset
      image_count: input.image_count
    params:
      prompt_tpl: inline-note.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "inline-prompt.json"
  - key: inline_images
    action: ai_image
    title: 文中插图出图
    when: input.with_inline_images == true
    after: [inline_prompts]
    inputs:
      shots: steps.inline_prompts.asset
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: adapt
    action: ai_text
    title: 多平台适配
    when: input.to_platforms exists
    after: [draft]
    inputs:
      source: steps.draft.asset
      platforms: input.to_platforms
      content_type: article
      protect_facts: true
    params:
      prompt_tpl: adapt-text.md
      output_purpose: export
      name_tpl: "adapt.md"
  - key: publish
    action: ai_text
    title: 发布稿
    after: [draft, cover, inline_images, adapt]
    inputs:
      draft: steps.draft.asset
      cover: steps.cover.asset
      cover_prompt: steps.cover_prompt.asset
      inline_prompts: steps.inline_prompts.asset
      adapted: steps.adapt.asset
    params:
      prompt_tpl: publish-note.md
      output_purpose: export
      name_tpl: "publish.md"
  - key: compliance
    action: compliance_check
    title: 发布稿合规审核
    when: input.with_compliance != false
    after: [publish]
    inputs:
      content: steps.publish.asset
    params: { llm_review: true, on_block: fail }
  - key: remember
    action: memory_write
    title: 沉淀风格样本
    after: [draft]
    inputs:
      content: steps.draft.asset
    params: { type: style, name: style-sample-latest, scope: project }
