key: note-clip
builtin: true
version: 3
name: 图文笔记
description: 适合：把一段素材或想法做成可直接发布的小红书式图文笔记。流程：主稿（可审阅）→ 封面/配图 → 多平台适配（可选）→ 发布稿 → 合规审核（可关，block 级拦截）。
genre: note
scene: produce
next: [platform-adapt, review-restock]
inputs:
  - key: topic
    label: 选题与目标受众点
    kind: text
    required: true
  - key: profile
    label: 账号档案（人设/受众称呼/口头禅/禁用词）
    kind: files
    required: false
    accept: [.md]
  - key: material
    label: 素材/事实线索（md/txt）
    kind: files
    required: false
    accept: [.md, .txt]
  - key: with_inline_images
    label: 内页配图（false=仅封面）
    kind: bool
    required: false
    default: false
  - key: image_count
    label: 内页配图张数
    kind: int
    required: false
    default: 3
  - key: to_platforms
    label: 多平台适配（选填，逗号分隔：公众号/小红书/知乎/头条/抖音/快手/视频号/B站；留空=仅原稿）
    kind: text
    required: false
  - key: with_compliance
    label: 发布稿合规审核（false=跳过；词库命中 block 级会拦截出稿）
    kind: bool
    required: false
    default: true
defaults:
  llm: { temperature: 0.7, max_tokens: 24000 }
  image: { provider: pollinations_image, size: "768x1024" }
steps:
  - key: recall
    action: memory_recall
    title: 记忆召回
    inputs:
      query: input.topic
    params: { limit: 3 }
  - key: draft
    action: ai_text
    title: 主稿
    after: [recall]
    inputs:
      topic: input.topic
      profile: input.profile
      material: input.material
      recalled: steps.recall.asset
    params:
      prompt_tpl: draft-note.md
      output_purpose: script
      name_tpl: "draft.md"
    gate:
      mode: required
      message: 请审阅图文主稿「{input.topic}」，批准后生成封面/配图；驳回可附修改意见重跑
  - key: cover_prompt
    action: ai_text
    title: 封面图提示词
    after: [draft]
    inputs:
      draft: steps.draft.asset
    params:
      prompt_tpl: cover-note.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "cover-prompt.json"
  - key: cover
    action: ai_image
    title: 封面出图
    after: [cover_prompt]
    inputs:
      shots: steps.cover_prompt.asset
    batch: { field: shots, max_concurrent: 1, retry: 1 }
  - key: inline_prompts
    action: ai_text
    title: 内页配图提示词
    when: input.with_inline_images == true
    after: [draft]
    inputs:
      draft: steps.draft.asset
      image_count: input.image_count
    params:
      prompt_tpl: inline-note.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "inline-prompt.json"
  - key: inline_images
    action: ai_image
    title: 内页配图出图
    when: input.with_inline_images == true
    after: [inline_prompts]
    inputs:
      shots: steps.inline_prompts.asset
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: adapt
    action: ai_text
    title: 多平台适配
    when: input.to_platforms exists
    after: [draft]
    inputs:
      source: steps.draft.asset
      platforms: input.to_platforms
      content_type: note
      protect_facts: true
    params:
      prompt_tpl: adapt-text.md
      output_purpose: export
      name_tpl: "adapt.md"
  - key: publish
    action: ai_text
    title: 发布稿
    after: [draft, cover, inline_images, adapt]
    inputs:
      draft: steps.draft.asset
      cover: steps.cover.asset
      cover_prompt: steps.cover_prompt.asset
      inline_prompts: steps.inline_prompts.asset
      adapted: steps.adapt.asset
    params:
      prompt_tpl: publish-note.md
      output_purpose: export
      name_tpl: "publish.md"
  - key: compliance
    action: compliance_check
    title: 发布稿合规审核
    when: input.with_compliance != false
    after: [publish]
    inputs:
      content: steps.publish.asset
    params: { llm_review: true, on_block: fail }
  - key: remember
    action: memory_write
    title: 沉淀风格样本
    after: [draft]
    inputs:
      content: steps.draft.asset
    params: { type: style, name: style-sample-latest, scope: project }
