key: video-plan
version: 1
name: 创作策划
description: 适合：为短剧做单条策划案（五节 + 视觉方向基准）。流程：记忆召回 → 参考素材（可选）→ 五节策划案（可审阅）→ 策划记忆沉淀。
genre: drama_short
scene: plan
next: [mengbao-episode]
inputs:
  - key: genre
    label: 题材与核心创意（题材/一句话创意/受众方向）
    kind: text
    required: true
  - key: platform
    label: 主发布平台
    kind: text
    required: false
    default: 抖音
  - key: episodes
    label: 规划集数（单集节奏规划总集数）
    kind: int
    required: false
    default: 12
  - key: materials
    label: 参考素材（选填，md/txt：世界观/人设/竞品分析/点单方向）
    kind: files
    required: false
    accept: [.md, .txt]
defaults:
  llm: { temperature: 0.8, max_tokens: 24000 }
steps:
  - key: recall
    action: memory_recall
    title: 记忆召回（往期策划/风格样本）
    inputs:
      query: input.genre
    params: { limit: 3 }
  - key: ingest
    action: manual_ingest
    title: 参考素材入库
    after: [recall]
    when: input.materials exists
    inputs:
      docs: input.materials
      brief: input.genre
  - key: plan
    action: ai_text
    title: 五节策划案 + Look Dev
    after: [recall, ingest]
    inputs:
      genre: input.genre
      platform: input.platform
      episodes: input.episodes
      materials: steps.ingest.assets
      recalled: steps.recall.asset
    params:
      prompt_tpl: plan-video.md
      output_purpose: export
      name_tpl: "plan.md"
    gate:
      mode: required
      message: 请审阅策划案「{input.genre}」（{input.episodes} 集规划），批准后沉淀入库；驳回可附修改意见重跑
      skip_label: 认可策划案
  - key: remember
    action: memory_write
    title: 沉淀策划记忆
    after: [plan]
    inputs:
      content: steps.plan.asset
    params: { type: plan, scope: project }
