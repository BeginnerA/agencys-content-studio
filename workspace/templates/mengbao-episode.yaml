key: mengbao-episode
version: 2
name: 萌宝短剧·单集流水线（v2：双闸门 / 动效可选）
description: 素材入库 → 单集剧本 → 分镜（可审阅）→ 静态出图或 AI 动效（按 motion 开关选路）→ 合成成片
genre: drama_short
inputs:
  - key: brief
    label: 本集题材简报
    kind: text
    required: true
  - key: setting_docs
    label: 设定底稿与参考素材（选填，支持 md/txt/图片）
    kind: files
    required: false
    accept: [.md, .txt, .png, .jpg, .jpeg]
  - key: episode_number
    label: 集号
    kind: int
    required: true
  - key: motion
    label: 镜头 AI 动效（true=ai_video 真实出片；false=静态图合成，M1 路径）
    kind: bool
    required: false
    default: false
  - key: with_storyboard_review
    label: 分镜审阅开关（true=分镜后挂闸门；false=免审直接出图）
    kind: bool
    required: false
    default: false
defaults:
  llm: { temperature: 0.8, max_tokens: 6000 }
  image: { provider: openai_image, size: "832x1248" }
  # ai_video 兜底参数（provider 需在项目 Settings 配置视频生成实例；resolution 为第三方档位 480p/720p）
  video: { duration: 4, resolution: "720p", aspect_ratio: "9:16" }
steps:
  - key: ingest_docs
    action: manual_ingest
    title: 素材入库
    inputs:
      docs: input.setting_docs
      brief: input.brief
  - key: write_script
    action: ai_text
    title: 生成单集剧本
    inputs:
      setting: steps.ingest_docs.assets
      brief: input.brief
    params:
      prompt_tpl: script-ep.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-剧本.md"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集剧本，批准后进入分镜；驳回可附修改意见重跑
  - key: make_storyboard
    action: ai_text
    title: 分镜与提示词包
    inputs:
      script: steps.write_script.asset
    params:
      prompt_tpl: storyboard-ep.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-分镜.json"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集分镜提示词包，批准后出图；驳回可附修改意见重跑
      when: input.with_storyboard_review == true
      skip_label: 免审直接出图
  - key: gen_images
    action: ai_image
    title: 批量镜头出图
    when: input.motion != true
    after: [make_storyboard]
    inputs:
      shots: steps.make_storyboard.asset
      characters: assets purpose=reference_character
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: gen_motion
    action: ai_video
    title: 批量镜头动效
    when: input.motion == true
    after: [make_storyboard]
    inputs:
      shots: steps.make_storyboard.asset
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: compose_video
    action: ffmpeg_merge
    title: 合成成片
    after: [gen_images, gen_motion]
    inputs:
      images: steps.gen_images.assets
      motion_clips: steps.gen_motion.assets
    params:
      fps: 25
      resolution: "1080x1920"
      cover: true
      duration_per_shot: 4
    output:
      purpose: final_video
