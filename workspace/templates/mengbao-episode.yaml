key: mengbao-episode
builtin: true
version: 11
name: 短剧·单集
description: 适合：按单集剧本产出带配音字幕的短剧成片（角色/场景/道具锚定 + 分镜出图 + 逐句配音）。流程：剧本 → 深度审查（可选）→ 角色档案与定妆照（可选，出图后人工审阅）→ 场景道具档案与参考图（可选，出图后人工审阅）→ 台词切句 → 分镜（可审阅）→ 逐句配音 → 以音定画出图或动效（出图后均人工审阅，动效镜时长按配音实测）→ 字幕 → 合成。
genre: drama_short
scene: produce
next: [review-restock]
inputs:
  - key: brief
    label: 本集题材简报
    kind: text
    required: true
  - key: setting_docs
    label: 设定底稿与参考素材（选填，支持 md/txt/图片）
    kind: files
    required: false
    accept: [.md, .txt, .png, .jpg, .jpeg]
  - key: episode_number
    label: 集号
    kind: int
    required: true
  - key: motion
    label: 镜头 AI 动效（true=ai_video 真实出片；false=静态图合成，M1 路径）
    kind: bool
    required: false
    default: false
  - key: with_storyboard_review
    label: 分镜审阅开关（true=分镜后挂闸门；false=免审直接出图）
    kind: bool
    required: false
    default: false
  - key: with_character_refs
    label: 生成定妆照并入档（true=角色参考图；false=仅建档）
    kind: bool
    required: false
    default: false
  - key: with_set_refs
    label: 生成场景/道具参考图并入档（true=素材参考图；false=仅建档）
    kind: bool
    required: false
    default: false
  - key: with_deep_review
    label: 剧本深度审查（true=剧本后附深度审查报告；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_narrative_doc
    label: 叙事流分镜（true=分镜后附人读叙事流；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_edit_review
    label: 可剪辑性把关（true=分镜后附剪辑验收报告；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_voice
    label: 配音与字幕（false=默片直出；true=逐句配音+精确字幕）
    kind: bool
    required: false
    default: true
  - key: i2v
    label: 首帧图生视频（需 motion=true；先批量出首帧图再以此图动效出片，出图+视频双重计费）
    kind: bool
    required: false
    default: false
defaults:
  llm: { temperature: 0.8, max_tokens: 24000 }
  image: { provider: pollinations_image, size: "832x1248" }
  # ai_video 兜底参数（provider 可在项目 settings 覆盖；minimax 支持 480p/768p，480p 单价更低）
  video: { provider: pollinations_video, duration: 5, resolution: "480p", aspect_ratio: "9:16" }
  # tts 兜底参数（provider 可在项目 settings 覆盖；声线六级链见 tts action）
  audio: { provider: pollinations_audio, voice: "Cherry" }
  # ── 开关 × 步骤依赖矩阵（11 输入开关 → 步骤触发；改任一开关前先查此表，避免静默跳步）──
  # 【互斥主分支】motion=false → gen_images（静态图合成，when: motion!=true）；
  #                motion=true  → gen_motion（ai_video 动效出片，when: motion==true）
  # 【i2v 子分支】i2v=true 仅在 motion=true 时生效：追加 gen_frames 首帧批量出图
  #                （when: motion==true 且 i2v==true），gen_motion 改以首帧驱动
  #                （motion_prompt 缺则回退 image_prompt）；出图+视频双重计费。
  #                ⚠ motion=false 时 i2v 无效（gen_frames/gen_motion 均不触发，仍走静态路径）
  # 【审阅闸·不改执行】with_storyboard_review=true → make_storyboard 后挂人工审阅闸（步本身恒执行，仅闸开关）
  # 【出图开关】with_character_refs=true → gen_refs 定妆照生成；false 仅 char_profile 建档，sync_characters 用空参考图
  #           with_set_refs=true → gen_set_refs 场景/道具参考图；false 仅 set_profile 建档，sync_set 用空参考图
  #           （四出图步 gen_refs/gen_set_refs/gen_images/gen_frames 均挂 required 可跳过审阅闸）
  # 【可选附加步】with_deep_review=true → script_review（+其审阅闸）；
  #               with_narrative_doc=true → storyboard_narrative；with_edit_review=true → edit_audit
  # 【配音字幕链】with_voice=false（默认 true）→ 跳过 cast_lines → 连带 voice/subtitle 无输入 → 默片直出；
  #               compose_video.fit_voice 无配音实测时长可依，退回 duration_per_shot 估长
  # 【恒执行步（不受上述开关）】ingest_docs / write_script(必审闸) / char_profile / ref_prompts /
  #               sync_characters / set_profile / set_ref_prompts / sync_set / make_storyboard / compose_video
steps:
  - key: ingest_docs
    action: manual_ingest
    title: 素材入库
    inputs:
      docs: input.setting_docs
      brief: input.brief
  - key: write_script
    action: ai_text
    title: 生成单集剧本
    inputs:
      setting: steps.ingest_docs.assets
      brief: input.brief
    params:
      prompt_tpl: script-ep.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-剧本.md"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集剧本，批准后进入分镜；驳回可附修改意见重跑
  - key: script_review
    action: ai_text
    title: 剧本深度审查
    after: [write_script]
    when: input.with_deep_review == true
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: script-audit.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-深度审查报告.md"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集深度审查报告（分级执行单 + R16/R17 验收）；认可通过后继续建档，如需重审可驳回附修改意见重跑
      when: input.with_deep_review == true
      skip_label: 认可通过
  - key: cast_lines
    action: ai_text
    title: 台词切句
    after: [write_script]
    when: input.with_voice != false
    inputs:
      script: steps.write_script.asset
    params:
      prompt_tpl: lines-cast-ep.md
      output_purpose: lines
      output_format: lines-json
      name_tpl: "{episode_number:03d}-台词.json"
  - key: char_profile
    action: ai_text
    title: 角色档案
    after: [write_script]
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: char-profile.md
      output_purpose: characters
      output_format: characters-json
      name_tpl: "{episode_number:03d}-角色档案.json"
  - key: ref_prompts
    action: ai_text
    title: 定妆照提示词
    after: [char_profile]
    inputs:
      characters: steps.char_profile.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: ref-prompts.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-定妆提示词.json"
  - key: gen_refs
    action: ai_image
    title: 定妆照生成
    when: input.with_character_refs == true
    after: [ref_prompts]
    inputs:
      shots: steps.ref_prompts.asset
    params:
      output_purpose: reference_character
    batch: { field: shots, max_concurrent: 1, retry: 1 }
    gate:
      mode: required
      message: 第 {input.episode_number} 集定妆照已生成，请逐张审阅角色形象是否与档案一致；不满意可在镜头工作台重出单张后回到本闸复审。定妆照将作为后续全部出图的角色参考，请先确认再进入建档
      skip_label: 免审直接建档
  - key: sync_characters
    action: character_sync
    title: 角色建档
    after: [char_profile, gen_refs]
    inputs:
      characters: steps.char_profile.asset
      ref_images: steps.gen_refs.assets
  - key: set_profile
    action: ai_text
    title: 场景/道具档案
    after: [write_script]
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: set-profile.md
      output_purpose: sets
      output_format: set-json
      name_tpl: "{episode_number:03d}-场景道具档案.json"
  - key: set_ref_prompts
    action: ai_text
    title: 场景/道具参考图提示词
    after: [set_profile]
    inputs:
      sets: steps.set_profile.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: set-ref-prompts.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-素材提示词.json"
  - key: gen_set_refs
    action: ai_image
    title: 场景/道具参考图生成
    when: input.with_set_refs == true
    after: [set_ref_prompts]
    inputs:
      shots: steps.set_ref_prompts.asset
    params:
      output_purpose: reference_scene
      output_purpose_by_category: { prop: reference_prop }
    batch: { field: shots, max_concurrent: 1, retry: 1 }
    gate:
      mode: required
      message: 第 {input.episode_number} 集场景/道具参考图已生成，请逐张审阅；不满意可在镜头工作台重出单张后回到本闸复审。参考图将作为后续出图的场景/道具锚定，请先确认再进入建档
      skip_label: 免审直接建档
  - key: sync_set
    action: entity_sync
    title: 场景/道具建档
    after: [set_profile, gen_set_refs]
    inputs:
      sets: steps.set_profile.asset
      ref_images: steps.gen_set_refs.assets
  - key: make_storyboard
    action: ai_text
    title: 分镜与提示词包
    after: [write_script, char_profile, set_profile, cast_lines]
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
      characters: steps.char_profile.asset
      sets: steps.set_profile.asset
      # [M11] 台词表（切句产物）：shots[].lines 归属依据（音字对齐映射源）；with_voice=false 时该步跳过 → 空输入安全
      lines: steps.cast_lines.asset
    params:
      prompt_tpl: storyboard-ep.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-分镜.json"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集分镜提示词包，批准后出图；驳回可附修改意见重跑
      when: input.with_storyboard_review == true
      skip_label: 免审直接出图
  - key: storyboard_narrative
    action: ai_text
    title: 叙事流分镜
    after: [make_storyboard]
    when: input.with_narrative_doc == true
    inputs:
      storyboard: steps.make_storyboard.asset
      script: steps.write_script.asset
    params:
      prompt_tpl: storyboard-narrative.md
      output_purpose: storyboard
      name_tpl: "{episode_number:03d}-叙事流分镜.md"
  - key: edit_audit
    action: ai_text
    title: 可剪辑性把关
    after: [make_storyboard]
    when: input.with_edit_review == true
    inputs:
      storyboard: steps.make_storyboard.asset
      script: steps.write_script.asset
    params:
      prompt_tpl: edit-audit.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-可剪辑性验收.md"
  - key: voice
    action: tts
    title: 逐句配音
    after: [cast_lines]
    inputs:
      lines: steps.cast_lines.asset
  - key: subtitle
    action: subtitle
    title: 字幕定时
    after: [voice, cast_lines]
    inputs:
      lines: steps.cast_lines.asset
      voices: steps.voice.assets
    params:
      prompt_tpl: lines-timing.md
  - key: gen_images
    action: ai_image
    title: 批量镜头出图
    when: input.motion != true
    after: [make_storyboard, sync_characters, sync_set]
    inputs:
      shots: steps.make_storyboard.asset
    batch: { field: shots, max_concurrent: 2, retry: 1 }
    gate:
      mode: required
      message: 第 {input.episode_number} 集全部镜头图已生成，请在镜头工作台逐镜审阅；不满意可重出单镜（仅该镜重新计费），避免单张废镜带崩后续合成。确认后进入配音字幕合成
      skip_label: 免审直接合成
  - key: gen_frames
    action: ai_image
    title: 首帧图生成（i2v）
    when: [input.motion == true, input.i2v == true]
    after: [make_storyboard, sync_characters, sync_set]
    inputs:
      shots: steps.make_storyboard.asset
    params:
      output_purpose: first_frame
    batch: { field: shots, max_concurrent: 2, retry: 1 }
    gate:
      mode: required
      message: 第 {input.episode_number} 集首帧图已生成，请检查角色长相与同框关系；不满意可在镜头工作台重出单镜。确认后将开始费用较高的图生视频（出图+视频双重计费），请先审阅再继续
      skip_label: 免审直接动效
  - key: gen_motion
    action: ai_video
    title: 批量镜头动效
    when: input.motion == true
    after: [make_storyboard, gen_frames, voice]
    inputs:
      shots: steps.make_storyboard.asset
      first_frame: steps.gen_frames.assets
      # [以音定画] 逐句配音实测时长 → 动效镜时长按台词音频设定（with_voice=false 时该输入为空 → 回退分镜估长/兜底）
      voices: steps.voice.assets
    params:
      prompt_field: motion_prompt,image_prompt
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: compose_video
    action: ffmpeg_merge
    title: 合成成片
    after: [make_storyboard, gen_images, gen_motion, voice, subtitle]
    inputs:
      # [M7] 分镜 JSON：静态图 per-shot 时长覆盖；选镜/编辑后重新合成自动生效
      shots: steps.make_storyboard.asset
      images: steps.gen_images.assets
      motion_clips: steps.gen_motion.assets
      voices: steps.voice.assets
      subtitle: steps.subtitle.assets
    params:
      fps: 25
      resolution: "1080x1920"
      cover: true
      duration_per_shot: 4
      fit_voice: true
      # [M11] 合成增强兜底（run 级 _compose 可覆盖；none/0 时与旧行为一致）
      transition: none
      transition_duration: 0.5
      bgm_volume: 0.25
      bgm_fade: 2
    output:
      purpose: final_video
