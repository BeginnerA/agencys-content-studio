key: mengbao-episode
version: 8
name: 短剧·单集
description: 适合：按单集剧本产出带配音字幕的短剧成片（角色/场景/道具锚定 + 分镜出图 + 逐句配音）。流程：剧本 → 深度审查（可选）→ 角色档案与定妆照（可选）→ 场景道具档案与参考图（可选）→ 台词切句 → 分镜（可审阅）→ 出图或动效 → 配音 → 字幕 → 合成。
genre: drama_short
scene: produce
next: [review-restock]
inputs:
  - key: brief
    label: 本集题材简报
    kind: text
    required: true
  - key: setting_docs
    label: 设定底稿与参考素材（选填，支持 md/txt/图片）
    kind: files
    required: false
    accept: [.md, .txt, .png, .jpg, .jpeg]
  - key: episode_number
    label: 集号
    kind: int
    required: true
  - key: motion
    label: 镜头 AI 动效（true=ai_video 真实出片；false=静态图合成，M1 路径）
    kind: bool
    required: false
    default: false
  - key: with_storyboard_review
    label: 分镜审阅开关（true=分镜后挂闸门；false=免审直接出图）
    kind: bool
    required: false
    default: false
  - key: with_character_refs
    label: 生成定妆照并入档（true=角色参考图；false=仅建档）
    kind: bool
    required: false
    default: false
  - key: with_set_refs
    label: 生成场景/道具参考图并入档（true=素材参考图；false=仅建档）
    kind: bool
    required: false
    default: false
  - key: with_deep_review
    label: 剧本深度审查（true=剧本后附深度审查报告；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_narrative_doc
    label: 叙事流分镜（true=分镜后附人读叙事流；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_edit_review
    label: 可剪辑性把关（true=分镜后附剪辑验收报告；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_voice
    label: 配音与字幕（false=默片直出；true=逐句配音+精确字幕）
    kind: bool
    required: false
    default: true
  - key: i2v
    label: 首帧图生视频（需 motion=true；先批量出首帧图再以此图动效出片，出图+视频双重计费）
    kind: bool
    required: false
    default: false
defaults:
  llm: { temperature: 0.8, max_tokens: 24000 }
  image: { provider: pollinations_image, size: "832x1248" }
  # ai_video 兜底参数（provider 可在项目 settings 覆盖；minimax 支持 480p/768p，480p 单价更低）
  video: { provider: pollinations_video, duration: 5, resolution: "480p", aspect_ratio: "9:16" }
  # tts 兜底参数（provider 可在项目 settings 覆盖；声线六级链见 tts action）
  audio: { provider: pollinations_audio, voice: "Cherry" }
steps:
  - key: ingest_docs
    action: manual_ingest
    title: 素材入库
    inputs:
      docs: input.setting_docs
      brief: input.brief
  - key: write_script
    action: ai_text
    title: 生成单集剧本
    inputs:
      setting: steps.ingest_docs.assets
      brief: input.brief
    params:
      prompt_tpl: script-ep.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-剧本.md"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集剧本，批准后进入分镜；驳回可附修改意见重跑
  - key: script_review
    action: ai_text
    title: 剧本深度审查
    after: [write_script]
    when: input.with_deep_review == true
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: script-audit.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-深度审查报告.md"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集深度审查报告（分级执行单 + R16/R17 验收）；认可通过后继续建档，如需重审可驳回附修改意见重跑
      when: input.with_deep_review == true
      skip_label: 认可通过
  - key: cast_lines
    action: ai_text
    title: 台词切句
    after: [write_script]
    when: input.with_voice != false
    inputs:
      script: steps.write_script.asset
    params:
      prompt_tpl: lines-cast-ep.md
      output_purpose: lines
      output_format: lines-json
      name_tpl: "{episode_number:03d}-台词.json"
  - key: char_profile
    action: ai_text
    title: 角色档案
    after: [write_script]
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: char-profile.md
      output_purpose: characters
      output_format: characters-json
      name_tpl: "{episode_number:03d}-角色档案.json"
  - key: ref_prompts
    action: ai_text
    title: 定妆照提示词
    after: [char_profile]
    inputs:
      characters: steps.char_profile.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: ref-prompts.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-定妆提示词.json"
  - key: gen_refs
    action: ai_image
    title: 定妆照生成
    when: input.with_character_refs == true
    after: [ref_prompts]
    inputs:
      shots: steps.ref_prompts.asset
    params:
      output_purpose: reference_character
    batch: { field: shots, max_concurrent: 1, retry: 1 }
  - key: sync_characters
    action: character_sync
    title: 角色建档
    after: [char_profile, gen_refs]
    inputs:
      characters: steps.char_profile.asset
      ref_images: steps.gen_refs.assets
  - key: set_profile
    action: ai_text
    title: 场景/道具档案
    after: [write_script]
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: set-profile.md
      output_purpose: sets
      output_format: set-json
      name_tpl: "{episode_number:03d}-场景道具档案.json"
  - key: set_ref_prompts
    action: ai_text
    title: 场景/道具参考图提示词
    after: [set_profile]
    inputs:
      sets: steps.set_profile.asset
      setting: steps.ingest_docs.assets
    params:
      prompt_tpl: set-ref-prompts.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-素材提示词.json"
  - key: gen_set_refs
    action: ai_image
    title: 场景/道具参考图生成
    when: input.with_set_refs == true
    after: [set_ref_prompts]
    inputs:
      shots: steps.set_ref_prompts.asset
    params:
      output_purpose: reference_scene
      output_purpose_by_category: { prop: reference_prop }
    batch: { field: shots, max_concurrent: 1, retry: 1 }
  - key: sync_set
    action: entity_sync
    title: 场景/道具建档
    after: [set_profile, gen_set_refs]
    inputs:
      sets: steps.set_profile.asset
      ref_images: steps.gen_set_refs.assets
  - key: make_storyboard
    action: ai_text
    title: 分镜与提示词包
    after: [write_script, char_profile, set_profile]
    inputs:
      script: steps.write_script.asset
      setting: steps.ingest_docs.assets
      characters: steps.char_profile.asset
      sets: steps.set_profile.asset
    params:
      prompt_tpl: storyboard-ep.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "{episode_number:03d}-分镜.json"
    gate:
      mode: required
      message: 请审阅第 {input.episode_number} 集分镜提示词包，批准后出图；驳回可附修改意见重跑
      when: input.with_storyboard_review == true
      skip_label: 免审直接出图
  - key: storyboard_narrative
    action: ai_text
    title: 叙事流分镜
    after: [make_storyboard]
    when: input.with_narrative_doc == true
    inputs:
      storyboard: steps.make_storyboard.asset
      script: steps.write_script.asset
    params:
      prompt_tpl: storyboard-narrative.md
      output_purpose: storyboard
      name_tpl: "{episode_number:03d}-叙事流分镜.md"
  - key: edit_audit
    action: ai_text
    title: 可剪辑性把关
    after: [make_storyboard]
    when: input.with_edit_review == true
    inputs:
      storyboard: steps.make_storyboard.asset
      script: steps.write_script.asset
    params:
      prompt_tpl: edit-audit.md
      output_purpose: script
      name_tpl: "{episode_number:03d}-可剪辑性验收.md"
  - key: voice
    action: tts
    title: 逐句配音
    after: [cast_lines]
    inputs:
      lines: steps.cast_lines.asset
  - key: subtitle
    action: subtitle
    title: 字幕定时
    after: [voice, cast_lines]
    inputs:
      lines: steps.cast_lines.asset
      voices: steps.voice.assets
    params:
      prompt_tpl: lines-timing.md
  - key: gen_images
    action: ai_image
    title: 批量镜头出图
    when: input.motion != true
    after: [make_storyboard, sync_characters, sync_set]
    inputs:
      shots: steps.make_storyboard.asset
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: gen_frames
    action: ai_image
    title: 首帧图生成（i2v）
    when: [input.motion == true, input.i2v == true]
    after: [make_storyboard, sync_characters, sync_set]
    inputs:
      shots: steps.make_storyboard.asset
    params:
      output_purpose: first_frame
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: gen_motion
    action: ai_video
    title: 批量镜头动效
    when: input.motion == true
    after: [make_storyboard, gen_frames]
    inputs:
      shots: steps.make_storyboard.asset
      first_frame: steps.gen_frames.assets
    params:
      prompt_field: motion_prompt,image_prompt
    batch: { field: shots, max_concurrent: 2, retry: 1 }
  - key: compose_video
    action: ffmpeg_merge
    title: 合成成片
    after: [make_storyboard, gen_images, gen_motion, voice, subtitle]
    inputs:
      # [M7] 分镜 JSON：静态图 per-shot 时长覆盖；选镜/编辑后重新合成自动生效
      shots: steps.make_storyboard.asset
      images: steps.gen_images.assets
      motion_clips: steps.gen_motion.assets
      voices: steps.voice.assets
      subtitle: steps.subtitle.assets
    params:
      fps: 25
      resolution: "1080x1920"
      cover: true
      duration_per_shot: 4
      fit_voice: true
    output:
      purpose: final_video
