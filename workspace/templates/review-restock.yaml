key: review-restock
builtin: true
version: 1
name: 复盘回灌
description: 适合：直接勾选本项目发布记录做复盘并把结论回灌为下一轮选题。流程：发布记录入库（含创作链路）→ 记忆召回 → 数据复盘（可审阅）→ 回灌选题（可选）→ 复盘记忆沉淀。
genre: other
scene: operate
next: [topic-radar]
inputs:
  - key: data
    label: 选择要复盘的发布记录（必填，可多选；系统自动汇总指标并带出创作链路）
    kind: publications
    required: true
  - key: period
    label: 观察期说明（选填，如 2026-08 或 2026-08-01~2026-08-24）
    kind: text
    required: false
  - key: with_restock
    label: 回灌选题清单（true=按复盘结论产出下一轮选题建议并沉淀）
    kind: bool
    required: false
    default: true
defaults:
  llm: { temperature: 0.6, max_tokens: 24000 }
steps:
  - key: ingest
    action: publication_ingest
    title: 发布记录入库
    inputs:
      pubs: input.data
  - key: recall
    action: memory_recall
    title: 记忆召回（历史复盘结论）
    after: [ingest]
    inputs:
      query: 历史复盘结论 高低表现特征 选题建议
    params: { limit: 5 }
  - key: review
    action: ai_text
    title: 数据复盘
    after: [ingest, recall]
    inputs:
      data: steps.ingest.assets
      period: input.period
      recalled: steps.recall.asset
    params:
      prompt_tpl: review-data.md
      output_purpose: export
      name_tpl: "review.md"
    gate:
      mode: required
      message: 请审阅数据复盘结论（含置信门禁标注），批准后沉淀并回灌选题；驳回可附修改意见重跑
      skip_label: 认可结论
  - key: restock
    action: ai_text
    title: 回灌选题清单
    after: [review]
    when: input.with_restock == true
    inputs:
      review: steps.review.asset
    params:
      prompt_tpl: restock-topics.md
      output_purpose: export
      name_tpl: "restock-topics.md"
  - key: remember
    action: memory_write
    title: 沉淀复盘记忆
    after: [review]
    inputs:
      content: steps.review.asset
    params: { type: review, scope: project }
  - key: remember_restock
    action: memory_write
    title: 沉淀回灌选题
    after: [restock]
    inputs:
      content: steps.restock.asset
    params: { type: review, scope: project }
