key: talking-clip
version: 1
name: 对白口播·单条（文案审阅 → 配音 → 字幕 → 合成）
description: 选题 → 口播文案（可审阅）→ 切句/封面并行 → 配音 + 字幕 → 单图成片
genre: talking_head
inputs:
  - key: topic
    label: 口播主题/选题
    kind: text
    required: true
  - key: ref_docs
    label: 参考素材（选填，md/txt）
    kind: files
    required: false
    accept: [.md, .txt]
  - key: duration_hint
    label: 目标秒数
    kind: int
    required: false
    default: 60
  - key: with_voice
    label: 生成配音（false=纯字幕版）
    kind: bool
    required: false
    default: true
defaults:
  llm: { temperature: 0.7, max_tokens: 6000 }
  image: { provider: openai_image, size: "1536x1024" }
  audio: { provider: openai_audio, voice: alloy }
steps:
  - key: draft
    action: ai_text
    title: 口播文案
    inputs:
      topic: input.topic
      ref_docs: input.ref_docs
      duration_hint: input.duration_hint
    params:
      prompt_tpl: draft-talking.md
      output_purpose: script
      name_tpl: "draft.md"
    gate:
      mode: required
      message: 请审阅口播文案「{input.topic}」，批准后进入切句/配音；驳回可附修改意见重跑
  - key: cover_prompt
    action: ai_text
    title: 封面图提示词
    after: [draft]
    inputs:
      draft: steps.draft.asset
    params:
      prompt_tpl: cover-talking.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "cover-prompt.json"
  - key: cast_lines
    action: ai_text
    title: 台词切句
    after: [draft]
    inputs:
      script: steps.draft.asset
      duration_hint: input.duration_hint
    params:
      prompt_tpl: lines-cast.md
      output_purpose: lines
      output_format: lines-json
      name_tpl: "lines.json"
  - key: subtitle
    action: subtitle
    title: 字幕定时
    after: [cast_lines]
    inputs:
      lines: steps.cast_lines.asset
    params:
      prompt_tpl: lines-timing.md
  - key: voice
    action: tts
    title: 逐句配音
    when: input.with_voice != false
    after: [cast_lines]
    inputs:
      lines: steps.cast_lines.asset
  - key: cover
    action: ai_image
    title: 封面出图
    after: [cover_prompt]
    inputs:
      shots: steps.cover_prompt.asset
    batch: { field: shots, max_concurrent: 1, retry: 1 }
  - key: compose
    action: ffmpeg_merge
    title: 合成成片
    after: [subtitle, voice, cover]
    inputs:
      images: steps.cover.assets
      voices: steps.voice.assets
      subtitle: steps.subtitle.assets
    params:
      fps: 25
      resolution: "1920x1080"
      cover: true
      duration_per_shot: 60
      subtitle_style: "FontName=Microsoft YaHei,FontSize=26,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=1.5,Shadow=0,MarginV=40"
    output:
      purpose: final_video
