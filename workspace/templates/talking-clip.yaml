key: talking-clip
builtin: true
version: 4
name: 对白口播
description: 适合：把选题做成对白口播视频（配音 + 精确字幕）。流程：口播文案（可审阅）→ 逐句配音 → 精确字幕 → 单图成片 → 平台发布文案（可选）→ 合规审核（可关，block 级拦截）。
genre: talking_head
scene: produce
next: [review-restock]
inputs:
  - key: topic
    label: 口播主题/选题
    kind: text
    required: true
  - key: profile
    label: 账号档案（人设/称呼/口头禅/禁用词）
    kind: files
    required: false
    accept: [.md]
  - key: ref_docs
    label: 参考素材（选填，md/txt）
    kind: files
    required: false
    accept: [.md, .txt]
  - key: duration_hint
    label: 目标秒数
    kind: int
    required: false
    default: 60
  - key: with_voice
    label: 生成配音（false=纯字幕版）
    kind: bool
    required: false
    default: true
  - key: with_subtitle_review
    label: 字幕审阅（true=字幕生成后挂闸门）
    kind: bool
    required: false
    default: false
  - key: platform
    label: 目标平台
    kind: select
    required: false
    options: [公众号, 小红书, 知乎, 头条, 抖音, 快手, 视频号, B站]
    default: 抖音
  - key: with_platform_copy
    label: 平台发布文案（true=产物标题/描述/话题/时段文案；false=关闭）
    kind: bool
    required: false
    default: false
  - key: with_compliance
    label: 文案合规审核（false=跳过；口播稿与平台文案均检，block 级拦截）
    kind: bool
    required: false
    default: true
defaults:
  llm: { temperature: 0.7, max_tokens: 24000 }
  image: { provider: pollinations_image, size: "1536x1024" }
  audio: { provider: pollinations_audio, voice: "Cherry" }
steps:
  - key: recall
    action: memory_recall
    title: 记忆召回
    inputs:
      query: input.topic
    params: { limit: 3 }
  - key: draft
    action: ai_text
    title: 口播文案
    after: [recall]
    inputs:
      topic: input.topic
      profile: input.profile
      ref_docs: input.ref_docs
      platform: input.platform
      duration_hint: input.duration_hint
      recalled: steps.recall.asset
    params:
      prompt_tpl: draft-talking.md
      output_purpose: script
      name_tpl: "draft.md"
    gate:
      mode: required
      message: 请审阅口播文案「{input.topic}」，批准后进入切句/配音；驳回可附修改意见重跑
  - key: remember
    action: memory_write
    title: 沉淀风格样本
    after: [draft]
    inputs:
      content: steps.draft.asset
    params: { type: style, name: style-sample-latest, scope: project }
  - key: cover_prompt
    action: ai_text
    title: 封面图提示词
    after: [draft]
    inputs:
      draft: steps.draft.asset
      platform: input.platform
    params:
      prompt_tpl: cover-talking.md
      output_purpose: storyboard
      output_format: storyboard-json
      name_tpl: "cover-prompt.json"
  - key: cast_lines
    action: ai_text
    title: 台词切句
    after: [draft]
    inputs:
      script: steps.draft.asset
      duration_hint: input.duration_hint
    params:
      prompt_tpl: lines-cast.md
      output_purpose: lines
      output_format: lines-json
      name_tpl: "lines.json"
  - key: voice
    action: tts
    title: 逐句配音
    when: input.with_voice != false
    after: [cast_lines]
    inputs:
      lines: steps.cast_lines.asset
  - key: subtitle
    action: subtitle
    title: 字幕定时
    after: [voice, cast_lines]
    inputs:
      lines: steps.cast_lines.asset
      voices: steps.voice.assets
    params:
      prompt_tpl: lines-timing.md
    gate:
      mode: required
      message: 请审阅字幕（measured 精确时间轴与显示行），批准后合成；驳回可附修改意见重跑
      when: input.with_subtitle_review == true
      skip_label: 免审直烧
  - key: cover
    action: ai_image
    title: 封面出图
    after: [cover_prompt]
    inputs:
      shots: steps.cover_prompt.asset
    batch: { field: shots, max_concurrent: 1, retry: 1 }
  - key: compose
    action: ffmpeg_merge
    title: 合成成片
    after: [subtitle, voice, cover]
    inputs:
      images: steps.cover.assets
      voices: steps.voice.assets
      subtitle: steps.subtitle.assets
    params:
      fps: 25
      resolution: "1920x1080"
      cover: true
      duration_per_shot: 60
      subtitle_style: "FontName=Microsoft YaHei,FontSize=26,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=1.5,Shadow=0,MarginV=40"
    output:
      purpose: final_video
  - key: platform_copy
    action: ai_text
    title: 平台发布文案
    when: input.with_platform_copy == true
    after: [draft]
    inputs:
      draft: steps.draft.asset
      platform: input.platform
    params:
      prompt_tpl: adapt-video.md
      output_purpose: export
      name_tpl: "platform-copy.md"
  - key: compliance
    action: compliance_check
    title: 口播文案合规审核
    when: input.with_compliance != false
    after: [draft]
    inputs:
      content: steps.draft.asset
    params: { llm_review: true, on_block: fail }
  - key: compliance_platform_copy
    action: compliance_check
    title: 平台文案合规审核
    when: [input.with_compliance != false, input.with_platform_copy == true]
    after: [platform_copy]
    inputs:
      content: steps.platform_copy.asset
    params: { llm_review: true, on_block: fail }
