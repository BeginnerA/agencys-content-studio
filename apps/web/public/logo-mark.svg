<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84">
  <!--
    百工工作室 · 品牌图形「榫卯拼块」(定稿 2026.09)
    语义：紫→靛渐变 = 模板工作台台面；深色卯槽 = 流水线插口；
          翠绿公件(带榫头)悬停槽口外，待滑入 = 内容模块在制。
    用法：favicon / 头像位 / 独立 mark。横版锁型请见 brand.html。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset=".62" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <rect width="84" height="84" rx="19" fill="url(#bg)" />
  <rect x="22" y="33" width="13" height="24" rx="3.5" fill="#0d1730" />
  <rect x="22" y="33" width="6.5" height="24" rx="3" fill="#16224a" />
  <rect x="41.5" y="28.5" width="25" height="33" rx="8.5" fill="url(#g)" />
  <rect x="34.5" y="38" width="7" height="14" rx="2.4" fill="url(#g)" />
</svg>
